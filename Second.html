<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body{
      background-color: #00111c;
      margin: 0;
      padding:0 ;
    }
    .first-button{
      background:none;
      border:none;
      color:white;
      font-size:2vw;
      margin-left: 7px;
      
    }
    .first-div{
      position: fixed;
      top:0;
      left:0; 
      z-index:20;
      display: flex;
      justify-content: space-between;
      background-color: #0B1218;
      margin-bottom:0px;
      width:100%;
      
    }
    .second-div{
      display: flex;
      place-items: center;
    }
    .first-header{
      color:white; 
      margin:10px;
      font-size: 3vw;
    }
    .third-div{
      width: 100%;
      position: relative;
    }
    .first-image{
      width: 100%;
    }
    .third-header{
      color: rgb(133, 132, 132);
      font-size: 2vw;
      margin-top:0px ;
      font-weight: 500;
      margin-bottom: 0px;
    }
    .second-header{
      color: white;
      font-size: 7vw;
      margin-bottom:5px;
      font-weight: 500;
      margin-top: 0px;
    }
    .fourth-div{
      position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
      width: 50%;
      text-align: center;
      place-items: center;
    }
    .first-input{
      padding:3px 7px;
      background-color: #0B1218;
      border: none;
      color: white;
      width: 33%;
      border-radius:3px;
      margin-left: 5px;
      margin-bottom: 5px;
      font-size: 10px;
      max-width: 150px;
    }
    .first-input::placeholder{
      color: rgb(183, 181, 181);
      font-size: 12px;
    }
    .first-input:focus{
      outline: none;
    }
    .second-button{
      padding:3px;
      background: rgb(131, 239, 230);
      border: 1px solid rgb(131, 239, 230);
      border-radius:2px ;
      width: 30%;
      margin: 0px;
      max-width: 50px;
      margin-left: 2px;
    }
    .fifth-div{
      background-color: #002031d2;
      padding:5px;
      border-radius: 3px;
      margin-top: 5px;
      place-items: center;
      width:75%;
      
    }
    .seventh-div{
      width:97.5%;
      position: relative;
      margin-bottom:10px;
      
    }
    
    .city{
      position:absolute;
      bottom:3px;
      left:3px;
      margin:0;
      color:white;
      font-size:20px;
    }
    .image{
      width:99%;
    }
    .sixth-div{
      display: grid;
      grid-template-columns: 1fr 1fr ;
      margin-top:1px;
      margin-left: 5px;
    }
    .fourth-header{
      color:white; 
      margin-bottom:0px;
      font-size:4vw;
    }
    .eight-div{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .mountain{
      margin-top: 2px;
      color:hwb(178 26% 21% / 0.2235294117647059); 
      margin-bottom: 0px;
      width:40%;
    }
    .text{
      color:white;
      margin-top:5px;
      margin-bottom: 10px;
      font-size: 10px;
    }
    .icon{
      text-align:center;
      background:#667f991e;
      margin: 10px;
      place-items: center;
      width:70%;
      margin-bottom: 10px;
    }
 .last-header{
   color:hwb(0 49% 51%);
   font-size:10px;
 } 
    .extra-div{
      text-align: center;
    }
    .stuff{
      margin-left: 0px;
      overflow:hidden;
      display:flex;
      place-items: center;
      text-align: center;
      width:10%;
      
    }
    .second-stuff{
      border:1px solid white; 
      width:60%; 
      margin:none;
      border-radius:50%;
    }
    .last-stuff{
      display: flex;
      text-align: center;
      place-items: center;
    }
  </style>
</head>
<body>
  <div class="first-div">
<div class="last-stuff">  <h2 class="first-header">WayPoint</h2></div>
  <div class="second-div">
    <button class="first-button">Discover</button>
    <button class="first-button">Destinations</button>
    <button class="first-button">Explore</button>
    <button class="first-button">My Journeys</button>
  </div>
    <div class="stuff"><img src="https://i.pinimg.com/1200x/18/15/84/1815845b70beb8fef029455bf430db02.jpg" alt="profile" class="second-stuff"></div>
  </div>
<div class="third-div">
    <img src="https://images.unsplash.com/photo-1742492541313-21372ed13e06?auto=format&fit=crop&w=1200&q=80⁠" alt="tokyo" class="first-image">
    <div class="fourth-div">
      <h2 class="second-header">Your Next Journey Starts Somewhere.</h2>
      <h2 class="third-header">Discover extraodinary places, explore new possibilities and plan journeys worth remebering</h2>
     <div class="fifth-div">
      <input type="text" placeholder="Destination" class="first-input">
      <input type ="date" placeholder="Travel Date" class="first-input">
      <button class="second-button">Explore</button>
    </div>
    </div>
  </div>
  <h2 class="fourth-header">Places to Visit</h2>
<div class="sixth-div"></div>
  <h2 class="fourth-header">Find your kind of escape. </h2>
  <div class="eight-div"></div>
<div class="extra-div">  <h2 class="last-header">Theres more to explore</h2></div>
  <script>
    let container2 = document.querySelector(".eight-div")
    let container = document.querySelector(".sixth-div");
    function card(image,name){
      return(`
      <div class="seventh-div">
      <img src="${image}" alt="image" class="image">
      <h2 class="city"> ${name}</h2>
      </div>
      `)
    }
    container.innerHTML += card("https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Cape Town")
    container.innerHTML += card("https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Kyoto")
    container.innerHTML += card("https://plus.unsplash.com/premium_photo-1661964149725-fbf14eabd38c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Santorini")
    container.innerHTML += card("https://images.unsplash.com/photo-1597212618440-806262de4f6b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Marrakech")
    container.innerHTML += card("https://images.unsplash.com/photo-1648023200358-9dc050df521d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Lagos")
    container.innerHTML += card("https://plus.unsplash.com/premium_photo-1677829177642-30def98b0963?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","Bali")
   function card2(icon,text){
     return(`
     <div class="icon">
     <div class="mountain">${icon}</div>
     <h2 class="text">${text}</h2>
     </div>
     `)
   }
    container2.innerHTML += card2('<i class="fa-solid fa-mountain"></i>',"Mountain")
    container2.innerHTML += card2('<i class="fa-solid fa-umbrella-beach"></i>',"Beaches")
    container2.innerHTML += card2('<i class="fa-solid fa-city"></i>',"Cities")
    container2.innerHTML += card2('<i class="fa-solid fa-tree"></i>',"Nature")
    container2.innerHTML += card2('<i class="fa-solid fa-landmark"></i>',"Cultural Experiences")
    container2.innerHTML += card2('<i class="fa-solid fa-compass"></i>',"Adventure")
  </script>
</body>
</html>
